name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: PHP ${{ matrix.php }} - CI
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']

    steps:
      - name: Checkout Bus
        uses: actions/checkout@v4
        with:
          path: bus
          fetch-depth: 0

      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          repository: momo-framework/kernel
          path: kernel
          token: ${{ secrets.GH_PAT }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, iconv, pcov, sockets
          coverage: pcov
          ini-values: pcov.directory=src, opcache.enable_cli=1

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('bus/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Dependencies
        working-directory: ./bus
        run: |
          composer config repositories.kernel path ../kernel
          composer install --prefer-dist --no-progress --no-interaction

      - name: Run CI Suite
        working-directory: ./bus
        run: composer ci